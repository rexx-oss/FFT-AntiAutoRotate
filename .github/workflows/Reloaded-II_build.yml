name: Reloaded-II Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S Reloaded-II

      - name: Build DLL
        run: cmake --build build --config Release

      - name: Stage Reloaded Mod Files
        run: |
          mkdir package
          copy build\Release\AntiAutoRotate.dll package\
          copy Reloaded-II\ModConfig.json package\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiAutoRotate-ReloadedII
          path: package/
