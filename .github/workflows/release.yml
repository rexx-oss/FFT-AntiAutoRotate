name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'AntiAutoRotate v1.0.0'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # --- 1. Build Original ASI (Root) ---
      - name: Configure CMake (ASI)
        run: cmake -B build-asi -S .

      - name: Build ASI
        run: cmake --build build-asi --config Release

      # --- 2. Build Reloaded-II Mod (TEST) ---
      - name: Configure CMake (Reloaded-II)
        run: cmake -B build-reloaded -S TEST

      - name: Build Reloaded-II DLL
        run: cmake --build build-reloaded --config Release

      # --- 3. Package Reloaded-II Mod ---
      - name: Package Reloaded-II Mod
        run: |
          mkdir package
          copy build-reloaded\Release\AntiAutoRotate.dll package\
          copy Reloaded-II\ModConfig.json package\
          powershell Compress-Archive -Path package\* -DestinationPath AntiAutoRotate-ReloadedII.zip

      # --- 4. Publish Both to Release ---
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            build-asi/Release/AntiAutoRotate.asi
            AntiAutoRotate-ReloadedII.zip