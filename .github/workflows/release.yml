name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'AntiAutoRotate v1.0.0'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      # 1. Download existing artifacts from the latest runs
      - name: Download Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download -n AntiAutoRotate-ReloadedII -D reloaded-files
          gh run download -n AntiAutoRotate-ASI -D asi-files

      # 2. Prepare the release files
      - name: Stage Release Files
        run: |
          # If Reloaded artifact was already zipped, move it; if it was uploaded as a folder, zip it
          if (Test-Path "reloaded-files\AntiAutoRotate-ReloadedII.zip") {
              Move-Item "reloaded-files\AntiAutoRotate-ReloadedII.zip" .\AntiAutoRotate-ReloadedII.zip
          } else {
              powershell Compress-Archive -Path reloaded-files\* -DestinationPath AntiAutoRotate-ReloadedII.zip
          }

          # Move the ASI file to the root for release
          Get-ChildItem -Path asi-files -Filter "AntiAutoRotate.asi" -Recurse | Move-Item -Destination .\AntiAutoRotate.asi

      # 3. Publish both downloaded builds to Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            AntiAutoRotate.asi
            AntiAutoRotate-ReloadedII.zip
